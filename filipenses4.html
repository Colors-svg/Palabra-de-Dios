<!DOCTYPE html>
<html lang="es" data-theme="oscuro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filipenses 4 — Palabra Visual</title>
  <meta name="description" content="Recorrido visual contemplativo y editorial por el libro de Oseas." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div class="app-shell" id="app">
    <div class="progress-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>

    <header class="top-bar" aria-label="Navegación principal">
      <div class="brand-cluster">
        <button class="icon-btn" id="btn-index" aria-label="Abrir índice de diapositivas" title="Índice de diapositivas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="15" y2="12"/><line x1="4" y1="17" x2="18" y2="17"/></svg>
        </button>
        <span id="book-current-label" style="font-family:var(--font-display);font-size:1.18rem;font-weight:500;padding:0 0.65rem 0 0.3rem;">Filipenses 4</span>
      </div>

      <div class="top-actions">
        <div class="dropdown" id="theme-dropdown">
          <button class="dropdown-trigger" id="theme-dropdown-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Seleccionar tema visual" title="Cambiar tema">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
            <span class="pill-label" id="theme-label">Noche</span>
            <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="dropdown-menu dropdown-menu--right" id="theme-dropdown-menu" role="listbox" aria-label="Temas visuales">
            <button class="dropdown-item is-selected" role="option" aria-selected="true" data-theme-choice="oscuro">
              <div class="dropdown-item-main">
                <span class="theme-swatch" style="background: linear-gradient(135deg, #0b0d11 55%, #cfa86e 55%);"></span>
                <div>
                  <span class="dropdown-item-title dropdown-item-title--sans">Noche profunda</span>
                  <span class="dropdown-item-sub">Oscuro contemplativo</span>
                </div>
              </div>
              <svg class="dropdown-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <button class="dropdown-item" role="option" aria-selected="false" data-theme-choice="claro">
              <div class="dropdown-item-main">
                <span class="theme-swatch" style="background: linear-gradient(135deg, #faf7f2 55%, #9a6735 55%);"></span>
                <div>
                  <span class="dropdown-item-title dropdown-item-title--sans">Amanecer cálido</span>
                  <span class="dropdown-item-sub">Luminoso editorial</span>
                </div>
              </div>
              <svg class="dropdown-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <button class="dropdown-item" role="option" aria-selected="false" data-theme-choice="sepia">
              <div class="dropdown-item-main">
                <span class="theme-swatch" style="background: linear-gradient(135deg, #efe6d5 55%, #874c2b 55%);"></span>
                <div>
                  <span class="dropdown-item-title dropdown-item-title--sans">Pergamino</span>
                  <span class="dropdown-item-sub">Sepia clásico</span>
                </div>
              </div>
              <svg class="dropdown-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
        </div>

        <button class="icon-btn" id="btn-fullscreen" aria-label="Pantalla completa" title="Pantalla completa (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
    </header>

    <main class="slides-stage" id="slides-stage" aria-live="polite"></main>

    <footer class="bottom-bar" aria-label="Navegación de diapositivas">
      <div class="slide-counter" id="slide-counter">01 / 10</div>
      <nav class="dots-nav" id="dots-nav" aria-label="Puntos de progreso"></nav>
      <div class="nav-arrows">
        <button class="icon-btn" id="btn-prev" aria-label="Diapositiva anterior" title="Anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="icon-btn" id="btn-next" aria-label="Siguiente diapositiva" title="Siguiente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </footer>

    <!-- Modal de detalle desplegable al pulsar un recuadro -->
    <div class="detail-modal-backdrop" id="detail-modal-backdrop" aria-hidden="true">
      <div class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
        <button class="icon-btn detail-modal-close" id="detail-modal-close" aria-label="Cerrar ventana">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="recuadro-icon" id="detail-modal-icon" aria-hidden="true"></div>
        <h3 class="detail-modal-title" id="detail-modal-title"></h3>
        <div class="detail-modal-body" id="detail-modal-body"></div>
      </div>
    </div>

    <!-- Pantalla de Revelado Dinámico -->
    <section class="lock-screen" id="lock-screen" aria-label="Contenido programado">
      <div class="lock-bg" id="lock-bg"></div>
      <div class="lock-card">
        <span class="kicker">Próxima reflexión</span>
        <h2 class="editorial-title" id="lock-title" style="margin-inline: auto;">Oseas</h2>
        <p class="editorial-subtitle" id="lock-msg" style="margin-inline: auto;">Esta reflexión estará disponible muy pronto.</p>
        <div class="countdown-grid" role="timer" aria-live="polite">
          <div class="countdown-cell"><span class="countdown-num" id="cd-days">00</span><span class="countdown-label">Días</span></div>
          <div class="countdown-cell"><span class="countdown-num" id="cd-hours">00</span><span class="countdown-label">Horas</span></div>
          <div class="countdown-cell"><span class="countdown-num" id="cd-mins">00</span><span class="countdown-label">Min</span></div>
          <div class="countdown-cell"><span class="countdown-num" id="cd-secs">00</span><span class="countdown-label">Seg</span></div>
        </div>
        <p style="font-size: var(--text-xs); color: var(--text-muted); letter-spacing: 0.08em;" id="lock-date-label"></p>
      </div>
    </section>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>

    <aside class="drawer" id="index-drawer" aria-label="Índice de diapositivas" aria-hidden="true">
      <div class="drawer-header">
        <h2 class="drawer-title">Recorrido</h2>
        <button class="icon-btn" id="btn-close-index" aria-label="Cerrar índice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="index-list"></div>
    </aside>
  </div>

  <script>window.PALABRA_BOOK = "filipenses4";</script>
  <script src="js/renderer.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
