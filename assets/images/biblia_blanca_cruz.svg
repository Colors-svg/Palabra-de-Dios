    <line x1="400" y1="45" x2="400" y2="295"/>
    <line x1="338" y1="105" x2="462" y2="229"/>
    <line x1="338" y1="229" x2="462" y2="105"/>
  </g>

  <!-- Cruz luminosa -->
  <path d="M390 68 L410 68 L410 156 L456 156 L456 178 L410 178 L410 278 L390 278 L390 178 L344 178 L344 156 L390 156 Z"
