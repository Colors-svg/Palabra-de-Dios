      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Halo sutil detrás de la cruz -->
  <circle cx="400" cy="170" r="210" fill="url(#crossGlow)"/>

  <!-- Rayos suaves no saturados -->
