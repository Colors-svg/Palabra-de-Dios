  <path d="M68 470 C130 460 270 446 365 460 C376 462 386 467 400 467 C414 467 424 462 435 460 C530 446 670 460 732 470 C736 472 732 478 718 480 C658 473 525 459 435 473 C420 476 410 480 400 480 C390 480 380 476 365 473 C275 459 142 473 82 480 C68 478 64 472 68 470 Z"
